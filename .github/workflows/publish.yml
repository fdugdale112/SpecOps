name: Publish to NuGet

on:
  push:
    tags: ['v*']

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - run: dotnet test -c Release

      - run: dotnet pack src/SpecOps -c Release -p:Version=${GITHUB_REF_NAME#v}

      - run: dotnet nuget push src/SpecOps/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - run: dotnet nuget add source --username fdugdale112 --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/fdugdale112/index.json"

      - run: dotnet nuget push src/SpecOps/bin/Release/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source github
